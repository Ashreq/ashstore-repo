name: Auto Update AshStore Repository

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-repository:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest changes
        run: |
          git fetch origin
          git checkout ${{ github.event.repository.default_branch }}
          git pull origin ${{ github.event.repository.default_branch }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Update apps and icons
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/update_repo.py

      - name: Commit and push updates
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add apps.json icons/

          if git diff --cached --quiet; then
            echo "No changes detected"
          else
            git commit -m "Auto update apps and icons"

            git push origin ${{ github.event.repository.default_branch }}
          fi
